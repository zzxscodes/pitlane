# pitlane startup config (INI-like). Omit a key or leave value empty to keep the default.
# conf_normalize() clamps unsafe values and prints hints at startup.
#
# Size mapping (every pool is fixed at startup; the hot path never allocates):
#   60s heartbeat               → broker.*_limit_us = 60000000
#   speed mode off              → [pace]/[shed] stay 0
#   risk broker count           → comment only (broker count ≠ max_live)
#   9 strategy + 15 trading     → QueryFold engines (compile-time 32)
#   account / position counts   → cash_cap / hold_cap soft ≤ kCashCap / kHoldCap
#   order / algo / control / package maxima → FanRing soft ≤ k*Cap
#     (powers of two; desk layout is fixed compile-time slots)
#   startup pools               → [yard] (startup map; hot path no alloc)
#   study pools                 → [study] (caller-side FactorSeries sizing)
#   log cap 2048                → log_cap soft ≤ kLogCap; pack_req_cap / pack_rsp_cap
#   paper-match timing          → [venue] (go/pull lags, rigid, tape_first/use_ext)
#   basic data / holidays       → seed_facts / seed_hours / seed_holidays (local APIs)
#   topics / algo routes        → TopicBus / RouteBook (local, no sockets)

[map]
hugepage = 1
lock = 1
prefault = 1
numa_node = -1
hugepage_dir = /dev/hugepages

[arena]
hugepage = 1
lock = 1
prefault = 1
numa_node = -1

[desk]
# Ring capacities must be powers of two and cannot exceed the compile-time maxima.
# Defaults equal k*Cap (trade/package scale). Soft-tune smaller when desired.
intent_cap = 32768
report_cap = 32768
quote_cap = 8192
algo_cap = 32768
control_cap = 16384
pulse_cap = 4096
print_cap = 4096
query_cap = 1024
pack_req_cap = 2048
pack_rsp_cap = 16384
log_cap = 2048
cash_cap = 512
hold_cap = 4096

[broker]
# 0 on qty/notional/live turns that axis off.
max_qty = 0
max_notional = 0
max_live = 0
# Defaults: a 60-second heartbeat → 60000000 µs. 0 disables that axis.
ack_limit_us = 60000000
life_limit_us = 60000000
pull_limit_us = 60000000
# watch_cap is compile-time (BrokerWatch::kCap); other values only produce a startup hint.
# watch_cap = 64

[query]
# Compile-time sizes; other values are restored with a startup hint.
engines = 32
accounts = 64
queue = 16
kinds = 8

[host]
# Best-effort via conf_apply_host. Negative / empty skips.
cpu = -1
policy = 0
priority = 0
set_nice = 0
nice = 0
hugepages = -1
thp_disable = 1
mlockall = 1
numa_node = -1
irq_list =

[shed]
target = 0
window = 0

[pace]
burst = 0
rate = 0
per = 1
idle = 0
gcra_interval = 0
gcra_tolerance = 0

[yard]
# Startup-sized symbol/quote yard (fixed pools, pitlane names).
# Defaults match the production pool counts. Ring depths are power-of-two.
sym_slots = 150000
quote_lanes = 150000
quote_depth = 256
order_lanes = 10
trade_lanes = 10
rebuild_lanes = 10
mix_lanes = 10
order_depth = 32768
trade_depth = 32768
rebuild_depth = 128
mix_depth = 32768
base_info_cap = 35000
trade_time_cap = 500

[study]
# Study-scale defaults for caller FactorSeries / NamedFactorRing.
signal_pools = 1000
sample_pools = 1000
factor_pools = 1000
nonstruct_pools = 1000
sample_depth = 100
factor_depth = 20
nonstruct_depth = 10

[venue]
# Paper match timing. Delays are µs; go_secN / delayN accept fractional seconds.
# Session bands: 09:30, 10:00, 10:30, 11:00, 11:30, 13:30, 14:00, 14:30, 15:00.
go_us1 = 0
go_us2 = 0
go_us3 = 0
go_us4 = 0
go_us5 = 0
go_us6 = 0
go_us7 = 0
go_us8 = 0
go_us9 = 0
pull_us1 = 0
pull_us2 = 0
pull_us3 = 0
pull_us4 = 0
pull_us5 = 0
pull_us6 = 0
pull_us7 = 0
pull_us8 = 0
pull_us9 = 0
# delay1 = 0.0
# cancel_delay1 = 0.0
rigid_rule = 1
use_ext = 0
rigid_extra = 0
trade_open = 1
lot = 1
notional_cap = 0
rate_cap = 0
cancel_pow_x1000 = 1000

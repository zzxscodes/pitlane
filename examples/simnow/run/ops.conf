# pitlane ops console settings (loaded with --web)
# Relative paths resolve from the directory you launch pitlane_simnow in.

port = 8080
doc_root = web

# Manual order limits, checked before anything reaches the OMS.
max_manual_qty = 10
max_manual_notional = 500000000
max_manual_per_min = 30

# Post-trade guard. Zero disables a limit.
max_daily_loss = 0
max_drawdown_ppm = 0
max_reject_ppm = 300000
stale_tick_us = 5000000

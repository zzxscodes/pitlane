# pitlane startup config (INI-like). Omit a key or leave value empty to keep the default.
# conf_normalize() clamps unsafe values and prints hints at startup.
#
# config.json mapping (shared-memory config / trade-lane config only; never Mongo / algo route):
#   HeartBeatIntervalSec 60     → broker.*_limit_us = 60000000
#   SpeedMode false             → [pace]/[shed] stay 0
#   RiskBrokerNum               → comment only (broker count ≠ max_live)
#   strategy engine count / trading engine count → QueryFold engines (compile-time 32)
#   AssetManageNum / PositionManageNum ~50 → cash_cap / hold_cap soft ≤ 256
#   MaxOrder* / MaxAlgo* / MaxControl* (up to 120000) → FanRing soft ≤ k*Cap
#     (cannot match 1:1; desk layout is fixed compile-time slots)
#   startup pool pools            → [yard] (startup map; hot path no alloc)
#   study pool pools         → [study] (caller-side FactorSeries sizing)
#   log report size 2048       → print_cap soft ≤ kPrintCap (512)

[map]
hugepage = 1
lock = 1
prefault = 1
numa_node = -1
hugepage_dir = /dev/hugepages

[arena]
hugepage = 1
lock = 1
prefault = 1
numa_node = -1

[desk]
# Ring capacities must be powers of two and cannot exceed the compile-time maxima.
intent_cap = 1024
report_cap = 1024
quote_cap = 2048
algo_cap = 256
control_cap = 256
pulse_cap = 512
print_cap = 512
query_cap = 256
cash_cap = 256
hold_cap = 256

[broker]
# 0 on qty/notional/live turns that axis off.
max_qty = 0
max_notional = 0
max_live = 0
# Defaults: trading center HeartBeatIntervalSec=60 → 60s in µs. 0 disables that axis.
ack_limit_us = 60000000
life_limit_us = 60000000
pull_limit_us = 60000000
# watch_cap is compile-time (BrokerWatch::kCap); other values only produce a startup hint.
# watch_cap = 64

[query]
# Compile-time sizes; other values are restored with a startup hint.
engines = 32
accounts = 64
queue = 16
kinds = 8

[host]
# Best-effort via conf_apply_host. Negative / empty skips.
cpu = -1
policy = 0
priority = 0
set_nice = 0
nice = 0
hugepages = -1
thp_disable = 1
mlockall = 1
numa_node = -1
irq_list =

[shed]
target = 0
window = 0

[pace]
burst = 0
rate = 0
per = 1
idle = 0
gcra_interval = 0
gcra_tolerance = 0

[yard]
# Startup-sized symbol/quote yard (startup pools role; pitlane names).
# Defaults match config.json pool counts. Ring depths are power-of-two.
sym_slots = 150000
quote_lanes = 150000
quote_depth = 256
order_lanes = 10
trade_lanes = 10
rebuild_lanes = 10
mix_lanes = 10
order_depth = 32768
trade_depth = 32768
rebuild_depth = 128
mix_depth = 32768
base_info_cap = 35000
trade_time_cap = 500

[study]
# study pool-scale defaults for caller FactorSeries / NamedFactorRing.
signal_pools = 1000
sample_pools = 1000
factor_pools = 1000
nonstruct_pools = 1000
sample_depth = 100
factor_depth = 20
nonstruct_depth = 10

# pitlane gateway registry (one line per market-data or trading gateway)
# gateway = <id> <md|td> <adapter> <account> <auto 0|1> [test|live]
#
# `account` is an id from accounts.conf (or a numeric account id). The hub
# starts and stops gateways through the audited command channel, so every action
# shows up in the console event log. `adapter` decides what can run:
#   tape | paper  available in the test mode
#   ctp           available in the live mode; broker address and credentials
#                 come from the CTP adapter's own conf, not this registry
#
# The sixth token selects the mode; a legacy five-token row defaults to test.
# The web console only shows and controls gateways of the session's mode.
#
# auto = 1 starts the gateway with the hub; auto = 0 leaves it stopped until an
# operator presses Start in the console.

gateway = sim-md md tape sim-test 1 test
gateway = sim-td td paper sim-test 1 test

# Live CTP trading gateway. Disabled until the hub runs a live conf; keep auto = 0
# because pitlane_trading logs the trading client in itself.
gateway = ctp-td td ctp sim-live 0 live

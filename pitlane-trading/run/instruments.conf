# Instrument reference data used by the watch list, the trade tab, and clearing.
# instrument = <name> <class> <ccy> <tick> <mult> <margin_ppm> <fee_ppm>
#              [min_fee=<n>]  (whole currency units) [stamp_ppm=<n>]
#              [close_fee_ppm=<n>] [close_today_fee_ppm=<n>] [fx_ppm=<n>]
#              [short=1] [gw=<gateway>]
#
# Prices use 1e-4 fixed point, so tick = 100 is one cent; cash in
# accounts.conf uses 1e-6, and min_fee below is in whole currency units.
# close_fee_ppm defaults to fee_ppm and close_today_fee_ppm to the close fee.
# fx_ppm is base-currency units per one currency unit (ppm); the account
# currency is the base, so HKD and USD products carry their rate here.
# class: astock hkstock future option usstock etf bond

instrument = 1 future  CNY 100  1000 120000  23     close_today_fee_ppm=46 short=1 gw=sim-td
instrument = 2 hkstock HKD 10   1   0       250    min_fee=5 stamp_ppm=1000 fx_ppm=920000
instrument = 3 future  CNY 200  10  100000  23     close_today_fee_ppm=46 short=1
instrument = 4 option  CNY 10   100 120000  30     close_today_fee_ppm=60 short=1
instrument = 5 usstock USD 100  1   0       100    fx_ppm=7100000
instrument = 6 etf     CNY 10   1   0       100    min_fee=5
instrument = 7 bond    CNY 1    1   0       30     min_fee=10
instrument = 8 future  CNY 500  10  120000  23     close_today_fee_ppm=46 short=1 gw=sim-td

# pitlane ops console settings (loaded with --web)
# Relative paths resolve from the directory you launch pitlane_trading in.

port = 8080
# Static client root. Leave empty to auto-detect the built-in client directory
# (client/ at the repo root); --web-root overrides this file.
# doc_root = ../client

# Listen address. Loopback by default; 0.0.0.0 exposes the console to other
# hosts, which is only safe on an isolated network. --web-bind overrides it.
bind = 127.0.0.1

# Manual order limits, checked before anything reaches the OMS.
max_manual_qty = 10
max_manual_notional = 500000000
max_manual_per_min = 30

# Post-trade guard. Zero disables a limit.
max_daily_loss = 0
max_drawdown_ppm = 0
max_reject_ppm = 300000
stale_tick_us = 5000000

# Market watch: a tick-to-tick move above this (ppm) raises a critical alarm,
# pulls every working order of the instrument, and stops its trading gateway.
# Two thirds of it raises a warning. Zero disables the jump monitor.
# Live mode only; replayed/backtest ticks never trigger it.
max_jump_ppm = 50000
